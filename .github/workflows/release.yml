name: Publish Homebrew cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to sync to the tap (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew
  cancel-in-progress: false

jobs:
  homebrew:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Expected a vX.Y.Z tag"; exit 1; }
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" == false ]] ||
            { echo "::error::Expected a published stable release"; exit 1; }
          [[ "$(gh release view --json tagName --jq .tagName)" == "$RELEASE_TAG" ]] ||
            { echo "::error::Refusing to point the tap at a release older than latest"; exit 1; }

      - uses: actions/checkout@v7
        with:
          repository: herval/homebrew-tap
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Generate the cask from the published archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive="notchbox_${RELEASE_TAG#v}_universal.zip"
          gh release download "$RELEASE_TAG" --pattern "$archive" --pattern "$archive.sha256" --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && shasum -a 256 -c "$archive.sha256")
          mkdir -p tap/Casks
          Scripts/render-cask.sh "$RELEASE_TAG" "$RUNNER_TEMP/$archive" > tap/Casks/notchbox.rb
          ruby -c tap/Casks/notchbox.rb

      - name: Push the cask to herval/homebrew-tap
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/notchbox.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
            exit 0
          fi
          git commit -m "notchbox ${RELEASE_TAG#v}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "::error::Could not push the cask after three attempts"
          exit 1
